  origin: {lat: 37.7924, lon: -122.4005, alt_m: 5.0}
  crs_epsg: 32610
  timezone: America/Los_Angeles
paths: {scratch_dir: '@SCRATCH@', work_dir: '@SCRATCH@/work', publish_name: opencity_test_area,
  W: '@SCRATCH@/work', CMB: '@SCRATCH@/fusion', G: '@SCRATCH@/fusion/geom', FW: '@SCRATCH@/fusion',
  CTX: '@SCRATCH@/src/context', SRCM: '@SCRATCH@/out', PANO: '@SCRATCH@/src', OUT: '@SCRATCH@/publish',
  KEEP: '@SCRATCH@/keep'}
